[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ThreeDimensionModeller"
version = "1.0.0"
description = "ThreeDimensionModeller builds a glTF model and an HTML viewer from outline images."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Wilgat Wong", email = "wilgat.wong@gmail.com"}
]
keywords = ["CLI", "TUI", "glTF", "3d", "outline"]

dependencies = [
    "ChronicleLogger>=1.3.1",
    "numpy>=2.3.0",
    "opencv-python-headless>=5.0.0.93",
    "scikit-image>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/cloudgen/ThreeDimensionModeller"
Repository = "https://github.com/cloudgen/ThreeDimensionModeller"
Issues = "https://github.com/cloudgen/ThreeDimensionModeller/issues"

[project.scripts]
three-dimension-modeller = "ThreeDimensionModeller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
